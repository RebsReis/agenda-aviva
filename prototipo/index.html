<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda Aviva — protótipo</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600&family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
:root{--aviva:#e4731d;--escuro:#c45a0f;--creme:#f6ebdd;--creme2:#ecdcc8;--tinta:#231a14}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Montserrat,system-ui,sans-serif;background:var(--creme);color:var(--tinta);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit}
.mt{background-image:radial-gradient(rgba(255,255,255,.22) 1.2px,transparent 1.3px);background-size:9px 9px}
.tit{font-family:Anton,Impact,sans-serif;text-transform:uppercase;line-height:.95;letter-spacing:.01em}
.scr{font-family:Caveat,cursive}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.demo{background:var(--tinta);color:#fff;font-size:12px;padding:8px 0}
.demo .wrap{display:flex;gap:6px;align-items:center;overflow-x:auto}
.demo b{white-space:nowrap;opacity:.7;margin-right:4px}
.chip{border:0;border-radius:999px;padding:6px 12px;font-weight:700;font-size:12px;background:rgba(255,255,255,.15);color:#fff;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--aviva)}
header{background:var(--aviva);color:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.12)}
header .wrap{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
header img{height:26px;cursor:pointer}
.user{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:999px;padding:6px 12px 6px 6px;font-weight:600;display:flex;gap:8px;align-items:center;cursor:pointer}
.av{width:24px;height:24px;border-radius:50%;background:#fff;color:var(--aviva);display:grid;place-items:center;font-weight:800;font-size:12px}
.menu{position:absolute;right:16px;top:54px;background:#fff;color:var(--tinta);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);width:220px;overflow:hidden;display:none}
.menu.open{display:block}
.menu div{padding:8px 16px;font-size:12px;opacity:.6;border-bottom:1px solid var(--creme2)}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 16px;cursor:pointer}
.menu button:hover{background:var(--creme)}
.hero{background:var(--aviva);color:#fff;padding-bottom:22px}
.hero .scr{font-size:24px;padding-top:6px}
.row{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.nav{display:flex;gap:8px;padding-bottom:4px}
.circ{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:22px;font-weight:700;cursor:pointer}
.hoje{height:40px;border-radius:999px;border:0;background:#fff;color:var(--aviva);font-weight:800;padding:0 14px;cursor:pointer}
.tabs{margin-top:16px;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.15);border-radius:12px;padding:4px}
.tabs button{border:0;background:none;color:#fff;font-weight:700;padding:9px;border-radius:9px;cursor:pointer}
.tabs button.on{background:#fff;color:var(--aviva)}
.filtros{position:relative;display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:2px;scrollbar-width:none}.filtros::-webkit-scrollbar{display:none}
.filtros button{border:0;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;background:rgba(255,255,255,.2);color:#fff;white-space:nowrap;cursor:pointer}
.filtros button.on{background:var(--tinta)}
main{padding:22px 16px 100px}main.wrap{padding-top:22px;padding-bottom:100px}
.card{background:#fff;border-radius:18px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.cal{padding:12px;margin-bottom:22px}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:11px;font-weight:700;opacity:.5;text-transform:uppercase;padding:4px 0}
.dia{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;font-size:14px;cursor:pointer;border:0;background:none}
.dia:hover{background:var(--creme)}
.dia.hj{background:var(--aviva);color:#fff}
.dots{display:flex;gap:2px;height:6px;margin-top:2px}.dots i{width:6px;height:6px;border-radius:50%}
h2.d{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;opacity:.6;margin:20px 0 8px}
h2.d.hj{color:var(--aviva);opacity:1}
.ev{display:flex;overflow:hidden;margin-bottom:8px;cursor:pointer;transition:.15s}
.ev:hover{box-shadow:0 4px 14px rgba(0,0,0,.1)}
.ev .hr{width:80px;flex-shrink:0;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 0}
.ev .hr span{font-size:11px;font-weight:600;opacity:.9}
.ev .tx{padding:12px 16px;min-width:0}
.ev small{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.ev h3{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev p{font-size:13px;opacity:.6}
.vazio{border:2px dashed var(--creme2);border-radius:14px;padding:12px 16px;font-size:13px;opacity:.5}
.ano{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.mes{padding:16px;cursor:pointer}
.mes li{list-style:none;display:flex;gap:8px;font-size:13px;margin-top:4px}
.mes li b{width:22px;opacity:.5}
.fab{position:fixed;right:20px;bottom:24px;height:56px;border-radius:999px;border:0;background:var(--aviva);color:#fff;font-weight:800;padding:0 24px;font-size:16px;box-shadow:0 8px 24px rgba(228,115,29,.45);cursor:pointer}
.btn{border:0;border-radius:12px;background:var(--aviva);color:#fff;font-weight:700;padding:12px 20px;cursor:pointer}
.btn2{border:2px solid var(--aviva);border-radius:12px;background:none;color:var(--aviva);font-weight:700;padding:11px 20px;cursor:pointer;width:100%}
.campo{width:100%;border:2px solid var(--creme2);border-radius:12px;padding:12px 14px;background:#fff;outline:0}
.campo:focus{border-color:var(--aviva)}
label.f{display:block;margin-bottom:14px}label.f span{display:block;font-weight:700;font-size:14px;margin-bottom:4px}
.selo{display:inline-block;transform:rotate(-2deg);background:#fff;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:800;text-transform:uppercase}
.q{padding:16px;margin-top:12px}
.resp{margin-top:12px;border-left:4px solid var(--aviva);background:var(--creme);border-radius:10px;padding:10px 12px}
.resp small{font-size:11px;font-weight:800;color:var(--aviva);text-transform:uppercase}
.voltar{background:none;border:0;color:#fff;font-weight:600;font-size:14px;cursor:pointer;opacity:.9}
.lk{background:none;border:0;color:var(--aviva);font-weight:700;cursor:pointer}
.auth{background:var(--aviva);color:#fff;padding:48px 24px 64px}
.authc{max-width:420px;margin:-40px auto 0;padding:24px}
.g-btn{width:100%;border:2px solid var(--creme2);background:#fff;border-radius:12px;padding:12px;font-weight:600;display:flex;gap:10px;justify-content:center;align-items:center;cursor:pointer}
.ou{display:flex;align-items:center;gap:10px;margin:18px 0;font-size:11px;font-weight:700;text-transform:uppercase;opacity:.4}.ou:before,.ou:after{content:"";flex:1;height:1px;background:#000}
.aviso{background:#fff3cd;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}
</style>
</head>

function addD(iso,n){const d=new Date(iso+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+n);return ISO(d)}
function addM(iso,n){const d=new Date(iso.slice(0,7)+"-01T12:00:00Z");d.setUTCMonth(d.getUTCMonth()+n);return ISO(d)}
const P=iso=>new Date(iso+"T12:00:00Z");

 if(d===6&&i%14<7)ev(i,"16:00","18:00","jovens","Culto Jovem","Salão dos jovens","Louvor, palavra e comunhão para a juventude.");
 if(d===4)ev(i,"19:30","21:30","louvor","Ensaio do Louvor","Templo principal","Ensaio da escala do domingo. Chegar 15 min antes para passar o som.");
}

 {id:2,t:"Campanha do agasalho",b:"Traga roupas e cobertores em bom estado até o fim do mês. Caixa de doação na recepção.",pin:false}];
const ES=[];
(function(){const f=td.slice(0,7)+"-01";const fam=["Família Souza","Família Lima e Ana","Jovens","Família Dias","Família Santos"];let k=0;
 for(let i=0;i<31;i++){const d=addD(f,i);if(d.slice(0,7)!==f.slice(0,7))break;const w=P(d).getUTCDay();
  if(w===6)ES.push({id:++uid,cat:"Limpeza",day:d,who:fam[k++%fam.length]});if(w===0)ES.push({id:++uid,cat:"Recepção",day:d,who:["Maria e Bruno","Carla e Ana"][k%2]});
  if(w===0){const n=k%3;[["Som",["Lucas","Pedro","Davi"]],["Luzes",["Rafa","Gabi","Lucas"]],["Fotos e Vídeos",["Bia e Léo","Ju","Bia"]],["Datashow",["Tiago","Mel","Tiago"]],["Avisos",["Pr. João","Paula","Davi"]]].forEach(([c,p])=>ES.push({id:++uid,cat:c,day:d,who:p[n],min:"midia"}))}}})();
function dl(d){const x=P(d);return DS[x.getUTCDay()]+", "+x.getUTCDate()}
function escalas(full,min){const by={};const ed=min?(S.role==="admin"||(isLid()&&R().min===min)):(S.role==="admin"||S.role==="secretaria");ES.filter(e=>e.day.slice(0,7)===td.slice(0,7)&&(e.min||null)===(min||null)).sort((a,b)=>a.day.localeCompare(b.day)).forEach(e=>(by[e.cat]=by[e.cat]||[]).push(e));
 return Object.entries(by).map(([c,l])=>{const nx=l.find(e=>e.day>=td);return `<div class="card" style="padding:16px;margin-top:12px"><b>Escala ${({som:"do",datashow:"do",luzes:"das",avisos:"dos"})[c.toLowerCase()]||"de"} ${esc(c.toLowerCase())} <span class="scr" style="font-weight:400;font-size:20px;color:var(--aviva)">de ${MESES[P(td).getUTCMonth()].toLowerCase()}</span></b>`+
 l.map(e=>`<div style="display:flex;gap:12px;align-items:baseline;padding:6px 8px;border-radius:8px;font-size:14px;${e===nx?"background:var(--creme);font-weight:700;":""}${e.day<td?"opacity:.4;":""}"><span style="width:62px;flex-shrink:0;opacity:.6">${dl(e.day)}</span><span style="flex:1">${esc(e.who)}</span>${e===nx?`<small style="font-size:11px;font-weight:800;color:var(--aviva)">PRÓXIMA</small>`:""}${full&&ed?`<button class="lk" style="font-size:12px" onclick="S.eEs=${e.id};render()">Alterar</button><button class="lk" style="color:#dc2626;font-size:12px" onclick="ES.splice(ES.findIndex(x=>x.id===${e.id}),1);render();toast('Removido da escala')">Remover</button>`:""}</div>${full&&S.eEs===e.id?`<div style="display:grid;gap:6px;padding:8px;background:var(--creme);border-radius:10px;margin:4px 0"><input id="eew" class="campo" style="padding:9px" value="${esc(e.who)}"><input id="eed" type="date" class="campo" style="padding:9px" value="${e.day}"><button class="btn" style="padding:9px" onclick="const x=ES.find(v=>v.id===${e.id});x.who=document.getElementById('eew').value;x.day=document.getElementById('eed').value;S.eEs=null;render();toast('Escala alterada')">Salvar</button></div>`:""}`).join("")+`</div>`}).join("")||`<p class="card" style="padding:16px;margin-top:12px;opacity:.5;font-size:14px">Nenhuma escala neste mês.</p>`}
function aviso(a,full){return `<div class="card ${a.pin?"mt":""}" style="padding:16px;margin-top:12px;${a.pin?"background-color:var(--aviva);color:#fff;":""}">${a.pin?`<span class="selo" style="color:var(--aviva);margin-bottom:8px">Importante</span>`:""}<h3 style="font-size:18px;font-weight:800">${esc(a.t)}</h3><p style="font-size:14px;margin-top:4px;${a.pin?"":"opacity:.7"}">${esc(a.b)}</p>${full&&podeAvisos()?`<div style="display:flex;gap:16px;margin-top:10px;font-size:12px;font-weight:700"><button class="lk" style="color:inherit;text-decoration:underline" onclick="AV.find(x=>x.id===${a.id}).pin=${!a.pin};render()">${a.pin?"Desafixar":"Fixar no topo"}</button>${podeAvisos()?`<button class="lk" style="color:inherit;text-decoration:underline" onclick="AV.splice(AV.findIndex(x=>x.id===${a.id}),1);render();toast('Aviso apagado')">Apagar</button>`:""}<button class="lk" style="color:inherit;text-decoration:underline" onclick="S.eAv=${a.id};render()">Editar</button></div>`:""}${full&&S.eAv===a.id&&podeAvisos()?`<div style="margin-top:10px;color:var(--tinta)"><input id="eat" class="campo" value="${esc(a.t)}"><textarea id="eab" class="campo" rows="3" style="margin-top:6px">${esc(a.b)}</textarea><button class="btn" style="width:100%;margin-top:6px;${a.pin?"background:#fff;color:var(--aviva)":""}" onclick="const x=AV.find(v=>v.id===${a.id});x.t=document.getElementById('eat').value;x.b=document.getElementById('eab').value;S.eAv=null;render();toast('Aviso atualizado')">Salvar alterações</button></div>`:""}</div>`}
const avOrd=()=>[...AV].sort((a,b)=>b.pin-a.pin||b.id-a.id);
function muralBloco(){return `<section style="margin-bottom:28px"><div class="row" style="align-items:baseline"><h2 class="tit" style="font-size:30px;color:var(--aviva)">Mural da igreja</h2><button class="lk" onclick="go({scr:'mural'})">Ver tudo ›</button></div>${avOrd().slice(0,3).map(a=>aviso(a,false)).join("")}${escalas(false)}${aniversariantes(false)}${dizimos()}</section>`}
function mural(){const ad=S.role==="admin",es=S.role==="admin"||S.role==="secretaria",em=S.role==="admin"||S.role==="midia";return header()+`<section class="hero mt"><div class="wrap"><p class="scr">fique por dentro</p><h1 class="tit" style="font-size:48px">Mural da igreja</h1><p style="font-size:14px;font-weight:600;opacity:.9;margin-top:4px">Avisos, escalas, aniversariantes, dízimos e ofertas.</p>${S.role==="midia"||S.role==="equipe"?`<p style="display:inline-block;margin-top:8px;background:rgba(255,255,255,.2);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:700">Mídia: você pode adicionar, editar e apagar avisos</p>`:""}</div></section><main class="wrap">
 <h2 class="tit" style="font-size:30px;color:var(--aviva)">Avisos</h2>${avOrd().map(a=>aviso(a,true)).join("")||`<p class="card" style="padding:16px;margin-top:12px;opacity:.5">Nenhum aviso no momento.</p>`}
 ${podeAvisos()?`<div style="border:2px dashed rgba(228,115,29,.45);border-radius:18px;padding:16px;margin-top:14px"><b>Novo aviso</b><input id="at" class="campo" style="margin-top:10px" placeholder="Título (ex.: Reunião geral de membros)"><textarea id="ab" class="campo" rows="3" style="margin-top:8px" placeholder="Detalhes do aviso"></textarea><label style="display:flex;gap:8px;align-items:center;background:var(--creme);border-radius:12px;padding:12px;margin-top:8px;font-size:14px;font-weight:600"><input id="ap" type="checkbox" style="width:20px;height:20px;accent-color:var(--aviva)">Destacar como importante</label><button class="btn" style="width:100%;margin-top:10px" onclick="novoAviso()">Publicar aviso</button></div>`:""}
 <h2 class="tit" style="font-size:30px;color:var(--aviva);margin-top:30px">Escalas</h2>${S.role==="secretaria"?`<p style="font-size:13px;font-weight:700;color:var(--aviva)">Você cuida das escalas: adicione e altere à vontade.</p>`:""}${escalas(true)}
 ${es?`<div style="border:2px dashed rgba(228,115,29,.45);border-radius:18px;padding:16px;margin-top:14px"><b>Adicionar à escala</b><input id="ec" class="campo" list="tp" value="Limpeza" style="margin-top:10px"><datalist id="tp"><option>Limpeza<option>Recepção<option>Santa Ceia<option>Cantina</datalist><input id="ed" type="date" class="campo" value="${td}" style="margin-top:8px"><input id="ew" class="campo" placeholder="Responsáveis (ex.: Família Souza)" style="margin-top:8px"><button class="btn" style="width:100%;margin-top:10px" onclick="novaEscala()">Adicionar</button></div>`:`<p style="font-size:13px;opacity:.5;margin-top:14px;text-align:center">As escalas da igreja são organizadas pela secretaria.</p>`}

 ${es?`<div style="border:2px dashed rgba(228,115,29,.45);border-radius:18px;padding:16px;margin-top:14px"><b>Adicionar aniversariante</b><input id="nan" class="campo" placeholder="Nome (ex.: Maria Souza)" style="margin-top:10px"><label style="display:block;font-size:14px;font-weight:600;margin-top:8px">Dia do aniversário em ${MESES[P(td).getUTCMonth()].toLowerCase()} <span style="font-weight:400;opacity:.5">(o ano não é guardado)</span><input id="nad" type="number" min="1" max="31" class="campo" style="margin-top:4px" placeholder="Ex.: 15"></label><p style="font-size:12px;opacity:.6;margin-top:8px">Cadastre só quem autorizou aparecer no mural.</p><button class="btn" style="width:100%;margin-top:10px" onclick="novoAniv()">Adicionar</button></div>`:""}
 <h2 class="tit" style="font-size:30px;color:var(--aviva);margin-top:30px">Dízimos e ofertas</h2>${dizimos()}
 ${ad?(!S.ePix?`<button class="btn2" style="margin-top:14px" onclick="S.ePix=true;render()">Alterar dados do Pix</button>`:pixPasso()):`<p style="font-size:13px;opacity:.5;margin-top:10px;text-align:center">Os dados do Pix só podem ser alterados pela administração.</p>`}</main>`}

 <div style="display:flex;gap:8px;margin-top:10px"><input id="eqm" type="email" class="campo" style="padding:9px" placeholder="E-mail de cadastro da pessoa"><button class="btn" style="padding:9px 14px" onclick="addEquipe()">Adicionar</button></div><p style="font-size:12px;opacity:.5;margin-top:6px">A pessoa precisa ter conta no app. Na prévia, teste com maria@email.com.</p></section>`}

 return `<div class="card" style="padding:16px;margin-top:12px"><b>🎉 Aniversariantes <span class="scr" style="font-weight:400;font-size:20px;color:var(--aviva)">de ${MESES[P(td).getUTCMonth()].toLowerCase()}</span></b>`+(l.length?l.map(a=>{const h=a.day===hd;return `<div style="display:flex;gap:12px;align-items:center;padding:6px 8px;border-radius:8px;font-size:14px;margin-top:4px;${h?"background:var(--aviva);color:#fff;font-weight:700":""}"><span style="width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;flex-shrink:0;${h?"background:#fff;color:var(--aviva)":"background:var(--creme);color:var(--aviva)"}">${String(a.day).padStart(2,"0")}</span><span style="flex:1">${esc(a.name)}</span>${h?`<small style="font-size:11px;font-weight:800">HOJE!</small>`:""}${ed?`<button class="lk" style="font-size:12px;${h?"color:#fff":""}" onclick="const n=ANIV.find(x=>x.id===${a.id});S.eAn=${a.id};render()">Alterar</button><button class="lk" style="font-size:12px;color:${h?"#fff":"#dc2626"}" onclick="ANIV.splice(ANIV.findIndex(x=>x.id===${a.id}),1);render();toast('Removido')">Remover</button>`:""}</div>${ed&&S.eAn===a.id?`<div style="display:flex;gap:6px;padding:6px 0"><input id="ean" class="campo" style="padding:9px" value="${esc(a.name)}"><input id="ead" type="number" min="1" max="31" class="campo" style="padding:9px;width:76px" value="${a.day}"><button class="btn" style="padding:9px 14px" onclick="const x=ANIV.find(v=>v.id===${a.id});x.name=document.getElementById('ean').value;x.day=+document.getElementById('ead').value;S.eAn=null;render();toast('Aniversariante alterado')">Salvar</button></div>`:""}`}).join(""):`<p style="font-size:14px;opacity:.5;margin-top:6px">Nenhum aniversariante cadastrado.</p>`)+`</div>`}
function dizimos(){return `<div class="card" style="background:var(--tinta);color:#fff;padding:20px;margin-top:12px"><p class="scr" style="font-size:24px;color:#f59a52">dízimos e ofertas</p><p style="font-size:14px;opacity:.8;margin-top:4px">${esc(PIX.msg)}</p>
 <p style="font-size:11px;font-weight:700;text-transform:uppercase;opacity:.6;margin-top:14px">Chave Pix (${PIX.type})</p><p style="font-size:19px;font-weight:800;word-break:break-all">${esc(PIX.key)}</p>
 <p style="font-size:11px;font-weight:700;text-transform:uppercase;opacity:.6;margin-top:10px">Favorecido</p><p style="font-weight:600">${esc(PIX.fav)} · ${esc(PIX.bank)}</p>
 <p style="font-size:11px;font-weight:700;text-transform:uppercase;opacity:.6;margin-top:10px">E-mail da igreja</p><p style="font-weight:600;word-break:break-all">${esc(PIX.email)}</p>
 <button class="btn" style="width:100%;margin-top:16px" onclick="copiarPix(this)">Copiar chave Pix</button><p style="font-size:12px;opacity:.6;margin-top:10px">Dados atualizados em ${PIXUPD}. Confira sempre se o favorecido é a igreja antes de confirmar o Pix. Se a chave mudar sem aviso da liderança, não faça o Pix e avise a igreja. <i>(Dados de exemplo.)</i></p></div>`}

function seg(){return header()+`<main class="wrap" style="max-width:560px"><p class="scr" style="font-size:24px;opacity:.6">proteja sua conta,</p><h1 class="tit" style="font-size:48px;color:var(--aviva)">Segurança</h1><div class="card" style="padding:20px;margin-top:16px"><b>Verificação em duas etapas</b><p style="font-size:14px;opacity:.7;margin-top:4px">Além da senha, o app pede um código que muda a cada 30 segundos no seu celular.</p>${S.role==="admin"?`<p style="background:var(--creme);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;margin-top:10px">Obrigatória para a administradora alterar os dados do Pix.</p>`:""}${MFA.on&&S.role==="admin"?`<p style="background:#dcfce7;color:#166534;border-radius:12px;padding:10px 12px;font-weight:600;margin-top:12px">✓ Ativada</p>`:`<button class="btn" style="width:100%;margin-top:12px" onclick="go({scr:'mural',ePix:true});setTimeout(()=>document.querySelector('#px_key,#cod,.btn2')?.scrollIntoView({block:'center'}),50)">Ativar verificação em duas etapas</button>`}</div></main>`}

 if(!MFA.on)return `<div style="${BOX}"><b>Ative a verificação em duas etapas</b><p style="font-size:14px;margin-top:6px">Para proteger as ofertas, alterar o Pix exige o código de um aplicativo autenticador (Google Authenticator ou similar).</p>
  ${S.qr?`<div style="margin:12px auto;width:150px;height:150px;background:repeating-conic-gradient(var(--tinta) 0 25%,#fff 0 50%) 0 0/18px 18px;border:8px solid #fff;border-radius:10px"></div><p style="font-size:12px;text-align:center;opacity:.6">Escaneie no aplicativo e digite o código</p>${codigo("MFA.on=true;MFA.ok=true;S.qr=false;render();toast('Duas etapas ativadas!')","Ativar")}`:`<button class="btn" style="width:100%;margin-top:10px" onclick="S.qr=true;render()">Ativar verificação em duas etapas</button>`}</div>`;
 if(!MFA.ok)return `<div style="${BOX}"><b>Confirme que é você</b><p style="font-size:14px;margin-top:6px">Digite o código do aplicativo autenticador para liberar a alteração.</p>${codigo("MFA.ok=true;render()","Confirmar código")}</div>`;
 const rev=S.pixRev;
 return `<div style="${BOX};display:grid;gap:8px"><b>Alterar dados do Pix</b><input id="px_key" class="campo" value="${esc(S.pk??PIX.key)}" placeholder="Chave Pix" oninput="S.pk=this.value;S.pixRev=false;pixBtn()">
 <input id="px_conf" class="campo" placeholder="Digite a chave nova de novo" onpaste="return false" style="display:${(S.pk??PIX.key)!==PIX.key?"block":"none"}" value="${esc(S.pc||"")}" oninput="S.pc=this.value;S.pixRev=false;pixBtn()">
 <select id="px_type" class="campo">${["CNPJ","E-mail","Telefone","Aleatória"].map(x=>`<option ${x===PIX.type?"selected":""}>${x}</option>`).join("")}</select><input id="px_fav" class="campo" value="${esc(PIX.fav)}" placeholder="Favorecido"><input id="px_bank" class="campo" value="${esc(PIX.bank)}" placeholder="Banco"><input id="px_email" class="campo" value="${esc(PIX.email)}" placeholder="E-mail da igreja">
 ${rev?`<div style="border:2px solid var(--aviva);background:var(--creme);border-radius:12px;padding:12px;font-size:14px"><b style="color:var(--aviva)">Confira a troca da chave Pix</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><div style="background:#fff;border-radius:8px;padding:8px"><small style="opacity:.5;font-weight:700">ANTES</small><p style="text-decoration:line-through;opacity:.6;word-break:break-all">${esc(PIX.key)}</p></div><div style="background:#fff;border-radius:8px;padding:8px"><small style="opacity:.5;font-weight:700">DEPOIS</small><p style="font-weight:800;word-break:break-all">${esc(S.pk)}</p></div></div></div>`:""}
 <p style="font-size:12px;opacity:.6">Só a admin, com verificação em duas etapas, pode alterar estes dados. Toda alteração fica no histórico.</p><button id="pxbtn" class="btn"></button></div>`}
function pixBtn(){const b=document.getElementById("pxbtn");if(!b)return;const nk=(S.pk??PIX.key).trim(),ch=nk!==PIX.key,cf=document.getElementById("px_conf");if(cf)cf.style.display=ch?"block":"none";
 if(ch&&!S.pixRev){const okc=(S.pc||"").trim()===nk;b.textContent=S.pc&&!okc?"As chaves não conferem":"Revisar alteração";b.disabled=!S.pc||!okc;b.style.opacity=b.disabled?.6:1;b.onclick=()=>{S.pixRev=true;render()}}
 else{b.textContent=ch?"Confirmar e salvar":"Salvar dados do Pix";b.disabled=false;b.style.opacity=1;b.onclick=salvarPix}}

function salvarPix(){["key","type","fav","bank","email"].forEach(k=>PIX[k]=document.getElementById("px_"+k).value.trim());PIXUPD=new Date().toLocaleDateString("pt-BR");S.ePix=false;S.pk=null;S.pc="";S.pixRev=false;render();toast("Dados do Pix atualizados")}

let S={role:"membro",view:"mes",day:td,filt:"",scr:"agenda",ev:null,menu:false};
const R=()=>ROLES.find(r=>r.k===S.role);
const isLid=()=>S.role==="lider"||S.role==="liderm"||S.role==="midia";
let EQUIPE=["Bia Nunes","Lucas Prado","Tiago Reis"];
const podeAvisos=()=>S.role==="admin"||S.role==="midia"||S.role==="equipe";
const canEdit=e=>{if(S.role==="admin")return true;if(!isLid()||e.min!==R().min)return false;const m=M(e.min);return m.leaders.length<=1||e.by===R().name};
const M=id=>MIN.find(m=>m.id===id);
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("on");setTimeout(()=>el.classList.remove("on"),2600)}
function go(o){Object.assign(S,o,{menu:false});render();scrollTo(0,0)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function header(){const r=R();return `<header class="mt"><div class="wrap"><img src="${LOGO}" onclick="go({scr:'agenda'})"><button class="user" onclick="S.menu=!S.menu;render()"><span class="av">${r.name[0]}</span>${r.name.split(" ")[0]}</button></div>
<div class="menu ${S.menu?"open":""}"><div>${S.role==="admin"?"Administradora geral":S.role==="lider"?"Líder do Louvor":S.role==="liderm"?"Líder das Mulheres":S.role==="midia"?"Líder da Mídia":S.role==="equipe"?"Equipe: Mídia":S.role==="secretaria"?"Secretaria da igreja":"Membro"}</div>
<button onclick="go({scr:'agenda'})">Agenda</button><button onclick="go({scr:'mural'})">Mural da igreja</button>${isLid()||S.role==="admin"?`<button onclick="go({scr:'novo'})">Novo evento</button>`:""}
${S.role==="admin"?`<button onclick="go({scr:'admin'})">Painel do admin</button>`:""}<button onclick="go({scr:'dados'})">Meus dados</button><button onclick="go({scr:'seg'})">Segurança</button><button onclick="go({role:'off'})" style="color:var(--aviva);font-weight:700">Sair</button></div></header>`}

function evCard(e){const m=M(e.min);return `<div class="card ev" onclick="go({scr:'evento',ev:${e.id}})"><div class="hr" style="background:${m.color}"><span class="tit" style="font-size:24px;opacity:1">${e.t}</span><span>até ${e.e}</span></div><div class="tx"><small style="color:${m.color}">${m.name}</small><h3>${esc(e.title)}</h3><p>📍 ${esc(e.loc)}</p>${m.leaders.length>1?`<p style="font-size:12px;opacity:.5">Responsável: ${esc(e.by)}</p>`:""}</div></div>`}

function range(){const d=P(S.day);if(S.view==="semana"){const s=addD(S.day,-d.getUTCDay());return[s,addD(s,7)]}if(S.view==="mes"){const s=S.day.slice(0,7)+"-01";return[s,addM(s,1)]}const y=S.day.slice(0,4);return[y+"-01-01",(+y+1)+"-01-01"]}
function agenda(){const[s,e]=range();const list=EV.filter(x=>x.day>=s&&x.day<e&&(!S.filt||x.min===S.filt)).sort((a,b)=>(a.day+a.t).localeCompare(b.day+b.t));
 const by={};list.forEach(x=>(by[x.day]=by[x.day]||[]).push(x));const d0=P(S.day);
 const last=P(addD(e,-1));
 const title=S.view==="ano"?d0.getUTCFullYear():S.view==="mes"?MESES[d0.getUTCMonth()]:`${P(s).getUTCDate()}–${last.getUTCDate()} ${MESES[last.getUTCMonth()].slice(0,3)}`;
 const prev=S.view==="semana"?addD(S.day,-7):S.view==="mes"?addM(S.day,-1):(d0.getUTCFullYear()-1)+"-01-01";
 const next=S.view==="semana"?addD(S.day,7):S.view==="mes"?addM(S.day,1):(d0.getUTCFullYear()+1)+"-01-01";
 let h=header()+`<section class="hero mt"><div class="wrap"><p class="scr">acompanhe tudo o que vai rolar</p><div class="row"><h1 class="tit" style="font-size:clamp(38px,12vw,60px)">${title}</h1><div class="nav"><button class="circ" onclick="go({day:'${prev}'})">‹</button><button class="hoje" onclick="go({day:'${td}'})">Hoje</button><button class="circ" onclick="go({day:'${next}'})">›</button></div></div>
 ${S.view!=="ano"?`<p style="font-size:14px;font-weight:600;opacity:.9;margin-top:4px">${d0.getUTCFullYear()}</p>`:""}
 <div class="tabs">${["semana","mes","ano"].map(v=>`<button class="${S.view===v?"on":""}" onclick="go({view:'${v}'})">${v==="semana"?"Semana":v==="mes"?"Mês":"Ano"}</button>`).join("")}</div>
 <div class="filtros"><button class="${!S.filt?"on":""}" onclick="go({filt:''})">Todos</button>${[...MIN].sort((x,y)=>(y.id==="geral")-(x.id==="geral")).map(m=>`<button class="${S.filt===m.id?"on":""}" onclick="go({filt:'${m.id}'})">${esc(m.name)}</button>`).join("")}</div></div></section><main class="wrap">`+(!S.filt||S.filt==="geral"?muralBloco():S.filt==="midia"?`<section style="margin-bottom:28px"><h2 class="tit" style="font-size:30px;color:var(--aviva)">Escalas da Mídia</h2>${escalas(S.role==="admin"||S.role==="midia","midia")}${S.role==="admin"||S.role==="midia"?`<div style="border:2px dashed rgba(15,118,110,.45);border-radius:18px;padding:16px;margin-top:14px"><b>Adicionar à escala da Mídia</b><select id="mc" class="campo" style="margin-top:10px"><option>Som</option><option>Luzes</option><option>Fotos e Vídeos</option><option>Datashow</option><option>Avisos</option></select><input id="md" type="date" class="campo" value="${td}" style="margin-top:8px"><input id="mw" class="campo" placeholder="Responsáveis (ex.: Lucas e Pedro)" style="margin-top:8px"><button class="btn" style="width:100%;margin-top:10px;background:#0F766E" onclick="novaEscalaMidia()">Adicionar</button></div>`:""}</section>${S.role==="admin"||S.role==="midia"?equipeBloco():""}`:"");
 if(S.view==="mes"){const f=S.day.slice(0,7)+"-01";const lead=P(f).getUTCDay();const n=P(addD(addM(f,1),-1)).getUTCDate();
  h+=`<div class="card cal"><div class="g">${DS.map(x=>`<div class="h">${x}</div>`).join("")}${"<div></div>".repeat(lead)}`;
  for(let i=0;i<n;i++){const k=addD(f,i);h+=`<button class="dia ${k===td?"hj":""}" onclick="go({view:'semana',day:'${k}'})">${i+1}<span class="dots">${(by[k]||[]).slice(0,3).map(x=>`<i style="background:${k===td?"#fff":M(x.min).color}"></i>`).join("")}</span></button>`}
  h+=`</div></div>`}
 if(S.view==="ano"){h+=`<div class="ano">`+MESES.map((nm,i)=>{const mm=S.day.slice(0,4)+"-"+String(i+1).padStart(2,"0");const l=list.filter(x=>x.day.startsWith(mm));
   return `<div class="card mes" onclick="go({view:'mes',day:'${mm}-01'})"><div class="row" style="align-items:baseline"><h3 class="tit" style="font-size:24px;color:var(--aviva)">${nm}</h3><small style="font-weight:700;opacity:.5">${l.length} eventos</small></div><ul>${l.slice(0,4).map(x=>`<li><b>${+x.day.slice(8)}</b>${esc(x.title)}</li>`).join("")}${l.length>4?`<li style="color:var(--aviva);font-weight:700;font-size:12px">+ ${l.length-4} mais</li>`:""}</ul></div>`}).join("")+`</div>`}
 else{let days=[];for(let k=s;k<e;k=addD(k,1))if(S.view==="semana"||by[k])days.push(k);
  if(!days.length)h+=`<div class="card" style="padding:32px;text-align:center"><p class="scr" style="font-size:30px;color:var(--aviva)">nada por aqui ainda</p></div>`;
  days.forEach(k=>{const d=P(k);h+=`<h2 class="d ${k===td?"hj":""}">${k===td?"Hoje · ":""}${DS[d.getUTCDay()]}, ${d.getUTCDate()} de ${MESES[d.getUTCMonth()].toLowerCase()}</h2>`+((by[k]||[]).map(evCard).join("")||`<div class="vazio">Nada programado</div>`)})}
 h+=`</main>`+(isLid()||S.role==="admin"?`<button class="fab" onclick="go({scr:'novo'})">+ Evento</button>`:"");return h}

function evento(){const e=EV.find(x=>x.id===S.ev);const m=M(e.min);const d=P(e.day);const ce=canEdit(e);
 let h=header()+`<section class="mt" style="background:${m.color};color:#fff;padding:16px 0 30px"><div class="wrap"><button class="voltar" onclick="go({scr:'agenda'})">‹ Agenda</button><div style="margin-top:12px"><span class="selo" style="color:${m.color}">${m.name}</span></div><h1 class="tit" style="font-size:48px;margin-top:12px">${esc(e.title)}</h1><p style="margin-top:12px;font-weight:600">${["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"][d.getUTCDay()]}, ${d.getUTCDate()} de ${MESES[d.getUTCMonth()].toLowerCase()} de ${d.getUTCFullYear()}</p><p style="font-weight:600">${e.t} às ${e.e} · ${esc(e.loc)}</p><p style="font-size:14px;opacity:.9;margin-top:4px">${m.leaders.length>1?"Responsável: "+esc(e.by):m.leaders[0]?"Líder: "+m.leaders[0]:"Sem líder definido"}</p></div></section><main class="wrap" style="padding-top:22px">`;
 if(ce)h+=`<button class="btn2" style="margin-bottom:18px" onclick="go({scr:'novo',edit:${e.id}})">Editar evento</button>`;
 h+=`<article class="card" style="padding:20px;line-height:1.6">${esc(e.desc)}</article>
 <h2 class="tit" style="font-size:30px;color:var(--aviva);margin-top:28px">Perguntas</h2><p class="scr" style="font-size:22px;opacity:.6">ficou com alguma dúvida? pergunta aqui!</p>
 <div class="card" style="padding:16px;margin-top:10px"><textarea id="qb" class="campo" rows="3" placeholder="Escreva sua pergunta..."></textarea><div class="row" style="align-items:center;margin-top:8px"><small style="opacity:.5">Seu nome aparecerá para os membros.</small><button class="btn" onclick="perguntar()">Perguntar</button></div></div>`;
 if(!e.qs.length)h+=`<p style="text-align:center;opacity:.5;font-size:14px;margin-top:16px">Nenhuma pergunta ainda.</p>`;
 e.qs.forEach((q,i)=>{h+=`<div class="card q"><div class="row" style="align-items:flex-start"><div><b style="font-size:14px">${esc(q.a)}</b><p style="margin-top:4px">${esc(q.b)}</p></div>${ce||q.a===R().name?`<button class="lk" style="opacity:.5;font-size:12px" onclick="apagarQ(${i})">Apagar</button>`:""}</div>`+
  (q.r?`<div class="resp"><small>${q.r.role} · ${q.r.n}</small><p style="margin-top:4px">${esc(q.r.t)}</p></div>`:ce?`<div style="display:flex;gap:8px;margin-top:12px"><input id="r${i}" class="campo" style="padding:9px 12px" placeholder="Responder..."><button class="btn" style="padding:9px 16px" onclick="responder(${i})">Enviar</button></div>`:`<p style="font-size:12px;font-weight:600;opacity:.4;margin-top:8px">Aguardando resposta</p>`)+`</div>`});
 return h+`</main>`}
function perguntar(){const v=document.getElementById("qb").value.trim();if(v.length<2)return;EV.find(x=>x.id===S.ev).qs.push({a:R().name,b:v,r:null});render();toast("Pergunta publicada!")}
function responder(i){const v=document.getElementById("r"+i).value.trim();if(!v)return;EV.find(x=>x.id===S.ev).qs[i].r={n:R().name,role:S.role==="admin"?"Admin":"Líder",t:v};render();toast("Resposta publicada!")}
function apagarQ(i){EV.find(x=>x.id===S.ev).qs.splice(i,1);render();toast("Pergunta removida")}

function form(){const e=S.edit?EV.find(x=>x.id===S.edit):null;const opts=S.role==="admin"?MIN:MIN.filter(m=>m.id===R().min);
 return header()+`<main class="wrap" style="max-width:560px"><button class="lk" onclick="go({scr:'agenda',edit:null})">‹ Voltar</button><h1 class="tit" style="font-size:40px;color:var(--aviva);margin:8px 0 16px">${e?"Editar":"Novo"} evento</h1>
 ${S.role==="lider"?`<div class="aviso">Como líder do Louvor, você só pode criar e editar eventos do <b>Louvor</b>.</div>`:S.role==="liderm"?`<div class="aviso">O Ministério de Mulheres tem várias líderes: você cria e edita <b>só os seus</b> eventos.</div>`:""}
 <div class="card" style="padding:20px"><label class="f"><span>Ministério</span><select id="fm" class="campo">${opts.map(m=>`<option value="${m.id}" ${e&&e.min===m.id?"selected":""}>${m.name}</option>`).join("")}</select></label>
 <label class="f"><span>Título</span><input id="ft" class="campo" value="${e?esc(e.title):""}" placeholder="Ex.: Culto de Celebração"></label>
 <label class="f"><span>Data</span><input id="fd" type="date" class="campo" value="${e?e.day:td}"></label>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label class="f"><span>Início</span><input id="fi" type="time" class="campo" value="${e?e.t:"19:30"}"></label><label class="f"><span>Término</span><input id="ff" type="time" class="campo" value="${e?e.e:"21:00"}"></label></div>
 <label class="f"><span>Local</span><input id="fl" class="campo" value="${e?esc(e.loc):""}" placeholder="Ex.: Templo principal"></label>
 <label class="f"><span>Descrição e informações</span><textarea id="fx" class="campo" rows="5" placeholder="Programação, o que levar...">${e?esc(e.desc):""}</textarea></label>
 <button class="btn" style="width:100%" onclick="salvar()">${e?"Salvar alterações":"Publicar evento"}</button></div>
 ${e?`<button class="btn2" style="margin-top:14px;border-color:#fca5a5;color:#dc2626" onclick="excluir()">Excluir evento</button>`:""}</main>`}
function salvar(){const g=id=>document.getElementById(id).value;if(g("ft").trim().length<2)return toast("Preencha o título");
 const data={min:g("fm"),title:g("ft").trim(),day:g("fd"),t:g("fi"),e:g("ff"),loc:g("fl")||"—",desc:g("fx")||""};
 if(S.edit){Object.assign(EV.find(x=>x.id===S.edit),data);go({scr:"evento",ev:S.edit,edit:null});toast("Evento atualizado")}
 else{EV.push({id:uid,...data,qs:[],by:R().name});go({scr:"evento",ev:uid++});toast("Evento publicado!")}}
function excluir(){EV.splice(EV.findIndex(x=>x.id===S.edit),1);go({scr:"agenda",edit:null});toast("Evento excluído")}

function admin(){return header()+`<main class="wrap"><p class="scr" style="font-size:24px;opacity:.6">painel da</p><h1 class="tit" style="font-size:48px;color:var(--aviva)">Administração</h1>
 <h2 class="tit" style="font-size:24px;margin-top:24px">Ministérios e líderes</h2><p style="font-size:14px;opacity:.6">Com uma líder só, ela cuida de todos os eventos do ministério. Com várias (ex.: Mulheres), cada uma edita só os eventos que criou.</p>
 ${MIN.map((m,i)=>`<div class="card" style="padding:14px;margin-top:10px"><div style="display:flex;gap:10px;align-items:center"><i style="width:14px;height:14px;border-radius:50%;background:${m.color};flex-shrink:0"></i><b style="flex:1">${esc(m.name)}</b><button class="lk" style="color:#dc2626;font-size:12px" onclick="MIN.splice(${i},1);EV.splice(0,EV.length,...EV.filter(e=>MIN.some(x=>x.id===e.min)));render();toast('Ministério excluído')">Excluir</button></div>
 <p style="font-size:11px;font-weight:700;text-transform:uppercase;opacity:.5;margin-top:10px">${m.leaders.length>1?`Líderes (${m.leaders.length}) · cada uma edita os próprios eventos`:"Líder"}</p>
 <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">${m.leaders.map((l,j)=>`<span style="display:flex;align-items:center;gap:6px;background:var(--creme);border-radius:999px;padding:4px 4px 4px 12px;font-size:14px;font-weight:600">${esc(l)}<button style="width:24px;height:24px;border-radius:50%;border:0;background:#fff;color:#dc2626;cursor:pointer" onclick="MIN[${i}].leaders.splice(${j},1);render();toast('Líder removida')">✕</button></span>`).join("")||`<span style="font-size:14px;opacity:.5">Sem líder</span>`}</div>
 <div style="display:flex;gap:8px;margin-top:8px"><select id="al${i}" class="campo" style="padding:9px"><option value="">${m.leaders.length?"Adicionar outra líder...":"Escolher líder..."}</option>${PESSOAS.filter(n=>!m.leaders.includes(n)).map(n=>`<option>${n}</option>`).join("")}</select><button class="btn2" style="width:auto;padding:9px 14px" onclick="const v=document.getElementById('al${i}').value;if(!v)return;MIN[${i}].leaders.push(v);render();toast('Líder adicionada')">Adicionar</button></div></div>`).join("")}
 <div class="card" style="padding:14px;margin-top:12px;border:2px dashed rgba(228,115,29,.45);box-shadow:none;background:transparent"><b style="font-size:14px">Adicionar ministério</b>
 <input id="nm" class="campo" placeholder="Ex.: Mulheres, Casais, Intercessão..." style="margin-top:8px">
 <div style="display:flex;gap:8px;margin-top:8px"><select id="nl" class="campo" style="padding:9px"><option value="">Sem líder por enquanto</option>${PESSOAS.map(n=>`<option>${n}</option>`).join("")}</select><input id="nc" type="color" value="#E4731D" style="width:52px;height:46px;border:0;background:none;flex-shrink:0" aria-label="Cor"></div>
 <button class="btn" style="width:100%;margin-top:10px" onclick="addMin()">Adicionar</button></div>
 <h2 class="tit" style="font-size:24px;margin-top:28px">Secretaria(o) da igreja</h2><p style="font-size:14px;opacity:.6">Adiciona e altera as escalas do Mural. Não publica avisos, não edita eventos e não vê dados de outros membros.</p>
 <div class="card" style="padding:14px;margin-top:10px"><select class="campo" onchange="SECRETARIA=this.value;toast(this.value?'Secretaria(o): '+this.value:'Sem secretaria(o)')"><option value="">Ninguém</option>${PESSOAS.filter(n=>n!=="Rebeca Reis").map(n=>`<option ${n===SECRETARIA?"selected":""}>${n}</option>`).join("")}</select></div>
 <h2 class="tit" style="font-size:24px;margin-top:28px">Pessoas cadastradas (9)</h2><p style="font-size:14px;opacity:.6">Visível só para você.</p>
 <div class="card" style="margin-top:10px">${[["Ana Lima","ana@email.com","Líder"],["Bruno Souza","bruno@email.com","Líder"],["Carla Dias","carla@email.com","Líder"],["Joana Alves","joana@email.com","Líder"],["Lia Santos","lia@email.com","Líder"],["Maria Santos","maria@email.com",""],["Marta Rocha","marta@email.com","Líder"],["Paula Martins","paula@email.com","Secretaria"],["Rebeca Reis","rebeca@email.com","Admin"]].map(p=>`<div style="padding:12px 16px;border-bottom:1px solid var(--creme2);display:flex;justify-content:space-between"><div><b>${p[0]}</b><br><small style="opacity:.5">${p[1]}</small></div><small style="color:var(--aviva);font-weight:800">${p[2]}</small></div>`).join("")}</div>
 <h2 class="tit" style="font-size:24px;margin-top:28px">Histórico de alterações</h2><div style="font-size:14px;margin-top:8px">${["<b>Ana Lima</b> editou evento “Ensaio do Louvor”","<b>Carla Dias</b> criou evento “Manhã de Natal Kids”","<b>Rebeca Reis</b> criou ministério “Infantil”"].map(t=>`<p class="card" style="padding:8px 12px;margin-bottom:4px;border-radius:10px">${t}</p>`).join("")}</div></main>`}

 <div class="card" style="padding:20px;margin-top:18px"><b>O que guardamos sobre você</b><p style="margin-top:10px;font-size:14px"><span style="opacity:.5">Nome</span><br><b>${r.name}</b></p><p style="margin-top:8px;font-size:14px"><span style="opacity:.5">E-mail</span><br><b>${r.name.split(" ")[0].toLowerCase()}@email.com</b></p><p style="font-size:12px;opacity:.5;margin-top:10px">Sua senha é guardada criptografada e ninguém consegue vê-la.</p></div>
 <div class="card" style="padding:20px;margin-top:14px"><b>Baixar meus dados</b><button class="btn2" style="margin-top:10px" onclick="toast('Na versão real, baixa um arquivo com seus dados')">Baixar (JSON)</button></div>
 <div class="card" style="padding:20px;margin-top:14px;border:2px solid #fecaca"><b style="color:#b91c1c">Excluir minha conta</b><p style="font-size:14px;opacity:.6;margin-top:4px">Apaga definitivamente seu login, seus dados e suas perguntas.</p><button class="btn" style="background:#dc2626;width:100%;margin-top:12px" onclick="toast(S.role==='admin'?'A admin precisa transferir o cargo antes':'Na versão real, a conta é apagada')">Excluir conta</button></div></main>`}

 <div class="card authc" style="box-shadow:0 10px 30px rgba(0,0,0,.12)"><button class="g-btn" onclick="go({role:'membro',scr:'agenda'})"><svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Entrar com Google</button>
 <div class="ou">ou com e-mail</div><input class="campo" placeholder="Seu e-mail" style="margin-bottom:10px"><input class="campo" type="password" placeholder="Senha" style="margin-bottom:12px"><button class="btn" style="width:100%" onclick="go({role:'membro',scr:'agenda'})">Entrar</button>
 <p style="text-align:center;font-size:14px;margin-top:18px"><span style="opacity:.6;text-decoration:underline">Esqueci minha senha</span><br><br>Ainda não tem conta? <b style="color:var(--aviva)">Criar conta</b></p></div>`}

function render(){document.getElementById("roles").innerHTML=ROLES.map(r=>`<button class="chip ${S.role===r.k?"on":""}" onclick="go({role:'${r.k}',scr:'agenda',edit:null})">${r.label}</button>`).join("");
 if(isLid()&&S.scr==="admin")S.scr="agenda";if((S.role==="membro"||S.role==="secretaria")&&(S.scr==="admin"||S.scr==="novo"))S.scr="agenda";
 if(S.scr==="novo"&&S.edit&&!canEdit(EV.find(x=>x.id===S.edit)))S.scr="agenda";
 document.getElementById("app").innerHTML=S.role==="off"?login():{agenda,evento,novo:form,admin,dados,mural,seg}[S.scr]();pixBtn();seguirFiltro()}
function seguirFiltro(){const f=document.querySelector(".filtros");if(!f)return;f.scrollLeft=S.fl||0;const on=f.querySelector(".on");if(!on)return;
 const alvo=Math.max(0,on.offsetLeft-f.clientWidth/2+on.clientWidth/2);f.scrollTo({left:alvo,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
 f.onscroll=()=>{S.fl=f.scrollLeft}}
render();
</script>
